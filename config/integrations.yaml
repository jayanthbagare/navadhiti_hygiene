git_provider:
  type: "github" # or "azure_repos", "gitlab"
  api_url: "https://api.github.com"
  org: "navadhiti" # org-wide repo discovery (A1); override for your actual org name
  # token should be set via env var: GIT_TOKEN

timesheet_system:
  type: "zoho_people" # placeholder
  api_url: "https://people.zoho.com/api"
  # token should be set via env var: TIMESHEET_TOKEN

# C3 — external ticketing system for issue-to-ticket traceability.
# Uncomment and fill in when Navadhiti's ticketing tool is decided; while
# this section is absent, the issue-to-ticket check reports
# undefined_standard ("standard not yet defined org-wide") and never
# fails repos. The optional existence-verification call is Jira-shaped:
# GET {api_url}/issue/{key} with a Bearer token.
# ticketing_system:
#   type: "jira"
#   api_url: "https://navadhiti.atlassian.net/rest/api/3"
#   token_env: "TICKETING_TOKEN"

email_scanner:
  type: "office365" # placeholder
  mailbox: "releases@navadhiti.com"
  # auth should be set via env var: EMAIL_CLIENT_SECRET
