git_provider:
  type: "github" # or "azure_repos", "gitlab"
  api_url: "https://api.github.com"
  org: "navadhiti" # org-wide repo discovery (A1); override for your actual org name
  # token should be set via env var: GIT_TOKEN

timesheet_system:
  type: "zoho_people" # placeholder
  api_url: "https://people.zoho.com/api"
  # token should be set via env var: TIMESHEET_TOKEN

# C3 — external ticketing system for issue-to-ticket traceability.
# Uncomment and fill in when Navadhiti's ticketing tool is decided; while
# this section is absent, the issue-to-ticket check reports
# undefined_standard ("standard not yet defined org-wide") and never
# fails repos. The optional existence-verification call is Jira-shaped:
# GET {api_url}/issue/{key} with a Bearer token.
# The host below is a placeholder: the real tenant domain is supplied by
# whoever operates the system and is never committed (see CONFIDENTIALITY.md).
# ticketing_system:
#   type: "jira"
#   api_url: "https://example-tenant.atlassian.net/rest/api/3"
#   token_env: "TICKETING_TOKEN"

email_scanner:
  type: "office365" # placeholder
  # The mailbox below is a placeholder, not an address. A real mailbox is
  # supplied by whoever operates the system and is never committed — this
  # address is the exact target a mailbox grant would be scoped to, so it
  # must not be a live one. `.invalid` is reserved by RFC 2606 and can never
  # resolve. Point the operator at the real mailbox in their own
  # configuration before enabling the email sign-off tier; until then the
  # transitional sign-off reports `method: none` honestly rather than
  # pretending the mailbox worked. See CONFIDENTIALITY.md.
  mailbox: "signoffs@example.invalid"
  # auth should be set via env var: EMAIL_CLIENT_SECRET